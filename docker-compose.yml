version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen_password
      POSTGRES_DB: lumen_oracle
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: ['./wait-for-it.sh', 'postgres:5432', '--', './wait-for-it.sh', 'redis:6379', '--', 'npm', 'run', 'dev']
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
